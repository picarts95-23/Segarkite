<title>SegarKite</title>

<style>
/* Layout: bar pengumuman, header lengket (logo, cari, voucher/pesanan/keranjang), hero carousel + dua kartu promo, grid kategori, flash sale, katalog, keunggulan, cara terima, lokasi + aduan, footer, laci keranjang, modal, bottom-nav HP. Panel admin memakai rute #admin. */
:root {
  --bg: #f7f8f4; --surface: #ffffff; --surface-2: #eef3ea; --fg: #10231a; --muted: #55655a; --line: #dde4d8;
  --forest: #14532d; --forest-2: #166534; --forest-3: #052e16; --leaf: #15803d; --leaf-soft: #dcfce7;
  --sunset: #c2410c; --sunset-soft: #ffedd5; --amber: #fbbf24; --amber-soft: #fef3c7; --amber-fg: #6b3d00;
  --danger: #b3261e; --danger-soft: #fde4e1; --info-soft: #e0f0fa; --ok-soft: #d9f2e1;
  --accent: #14532d; --accent-fg: #ffffff; --hd-a: #14532d; --hd-b: #1b6b3a; --hd-fg: #ecfdf5; --scrim: rgba(8, 24, 16, .55);
  --font-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1711; --surface: #13261c; --surface-2: #1a3126; --fg: #e8f1ea; --muted: #9db2a4; --line: #274236;
    --forest: #5fcb8d; --forest-2: #86e0ac; --forest-3: #052e16; --leaf: #5fcb8d; --leaf-soft: #1c3b2a;
    --sunset: #ff9a63; --sunset-soft: #3d2415; --amber: #f5b72e; --amber-soft: #3a2f10; --amber-fg: #f6d78b;
    --danger: #f4948c; --danger-soft: #3d1c1a; --info-soft: #17313f; --ok-soft: #1c3a2b;
    --accent: #5fcb8d; --accent-fg: #06251a; --hd-a: #0f3a22; --hd-b: #155230; --scrim: rgba(0, 0, 0, .65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1711; --surface: #13261c; --surface-2: #1a3126; --fg: #e8f1ea; --muted: #9db2a4; --line: #274236;
  --forest: #5fcb8d; --forest-2: #86e0ac; --forest-3: #052e16; --leaf: #5fcb8d; --leaf-soft: #1c3b2a;
  --sunset: #ff9a63; --sunset-soft: #3d2415; --amber: #f5b72e; --amber-soft: #3a2f10; --amber-fg: #f6d78b;
  --danger: #f4948c; --danger-soft: #3d1c1a; --info-soft: #17313f; --ok-soft: #1c3a2b;
  --accent: #5fcb8d; --accent-fg: #06251a; --hd-a: #0f3a22; --hd-b: #155230; --scrim: rgba(0, 0, 0, .65); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--hd-a); z-index: 95; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { width: 100%; max-width: 1200px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--leaf); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 800; text-decoration: none; background: var(--surface-2); color: var(--fg); }
.btn-primary { background: var(--accent); color: var(--accent-fg); }
.btn-hot { background: var(--sunset); color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-hot { color: #2b1200; } }
:root[data-theme="dark"] .btn-hot { color: #2b1200; }
.btn-ghost { background: transparent; border-color: var(--line); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-sm { padding: 7px 12px; border-radius: 9px; font-size: 13px; }
.btn[disabled], button[disabled] { opacity: .55; cursor: not-allowed; }
.field { margin-top: 12px; min-width: 0; }
.field label, .lbl { display: block; font-size: 12.5px; font-weight: 800; margin-bottom: 5px; }
.field input:not([type=checkbox]):not([type=file]):not([type=radio]), .field select, .field textarea, .inp { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.field textarea { resize: vertical; min-height: 64px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.err { color: var(--danger); font-size: 12.5px; font-weight: 700; margin-top: 4px; }
.notice { padding: 10px 12px; border-radius: 10px; background: var(--amber-soft); color: var(--amber-fg); font-size: 13px; font-weight: 600; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 800; background: var(--surface-2); }
.pill.s-Baru { background: var(--amber-soft); color: var(--amber-fg); }
.pill.s-Dikonfirmasi, .pill.s-Diproses { background: var(--info-soft); }
.pill.s-Dikemas, .pill.s-Diantar { background: var(--leaf-soft); color: var(--leaf); }
.pill.s-Selesai { background: var(--ok-soft); color: var(--leaf); }
.pill.s-Dibatalkan { background: var(--danger-soft); color: var(--danger); }
.tgl { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; }
.tgl input { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }

/* Pengumuman + header */
.announce { background: #052e16; color: #d1fae5; font-size: 12px; padding: 7px 0; }
.announce .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.announce .tag { background: #c2410c; color: #fff; font-weight: 800; padding: 1px 8px; border-radius: 5px; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; flex-shrink: 0; }
.announce p { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.announce .loc { color: #fcd34d; font-weight: 700; flex-shrink: 0; }
.closed-bar { background: var(--danger-soft); color: var(--danger); font-weight: 800; text-align: center; padding: 10px 16px; font-size: 14px; }
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: linear-gradient(90deg, var(--hd-a), var(--hd-b)); color: var(--hd-fg); box-shadow: 0 2px 12px rgba(0, 0, 0, .18); }
.hd { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; flex-shrink: 0; }
.brand img { width: 46px; height: 46px; border-radius: 14px; display: block; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
.brand b { display: block; font-size: 21px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.brand b em { color: #fcd34d; font-style: normal; }
.brand small { display: block; font-size: 10.5px; color: #a7f3d0; font-weight: 600; }
.searchbox { flex: 1; min-width: 0; max-width: 640px; }
.sb-row { position: relative; display: flex; align-items: center; }
.sb-row input { width: 100%; padding: 10px 88px 10px 14px; border-radius: 12px; border: 0; background: #fff; color: #10231a; font-weight: 500; font-size: 14px; }
.sb-row button { position: absolute; right: 5px; background: #c2410c; color: #fff; border: 0; border-radius: 9px; padding: 6px 14px; font-weight: 800; font-size: 13px; }
.kw { display: flex; gap: 12px; margin-top: 5px; font-size: 11.5px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
.kw b { color: #fcd34d; }
.kw button { background: none; border: 0; color: #d1fae5; padding: 0; font-size: 11.5px; }
.kw button:hover { text-decoration: underline; }
.hd-acts { display: flex; gap: 8px; flex-shrink: 0; margin-left: auto; }
.hd-btn { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 56px; padding: 6px 10px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .1); color: #fff; font-size: 10.5px; font-weight: 800; }
.hd-btn span.ic { font-size: 16px; line-height: 1.2; }
.hd-btn:hover { background: rgba(255, 255, 255, .2); }
.cart-btn { flex-direction: row; gap: 8px; background: #fbbf24; color: #10231a; border-color: #fbbf24; font-size: 13px; padding: 9px 14px; }
.cart-btn:hover { background: #fcd34d; }
.badge-n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #c2410c; color: #fff; font-size: 11px; font-weight: 800; display: inline-grid; place-items: center; }
.hd-btn .badge-n { position: absolute; top: -6px; right: -6px; background: #fbbf24; color: #10231a; }

/* Hero */
main { padding-block: 18px 30px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.hero { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; }
.slide { position: relative; border-radius: 22px; overflow: hidden; background: linear-gradient(135deg, #052e16, #14532d 55%, #1b6b3a); color: #fff; min-height: 280px; display: flex; align-items: center; }
.slide-in { padding: 28px 28px 40px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 22px; align-items: center; width: 100%; }
.slide .tag { display: inline-block; background: #fbbf24; color: #10231a; font-weight: 800; font-size: 11px; padding: 3px 12px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; }
.slide h2 { font-size: clamp(24px, 3.6vw, 38px); line-height: 1.12; font-weight: 800; margin-top: 12px; }
.slide p { margin-top: 10px; color: #d1fae5; font-size: 14px; max-width: 54ch; }
.slide .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.slide .btn-ghost { color: #fff; border-color: rgba(255, 255, 255, .35); }
.logo-card { position: relative; width: 168px; height: 168px; border-radius: 28px; overflow: hidden; border: 3px solid rgba(252, 211, 77, .5); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
.logo-card img { width: 100%; height: 100%; display: block; object-fit: cover; }
.logo-card .em { position: absolute; right: 8px; bottom: 8px; width: 46px; height: 46px; border-radius: 14px; background: #fff; display: grid; place-items: center; font-size: 26px; box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
.dots { position: absolute; left: 28px; bottom: 14px; display: flex; gap: 7px; }
.dots button { width: 8px; height: 8px; border-radius: 4px; border: 0; padding: 0; background: rgba(255, 255, 255, .4); transition: width .2s; }
.dots button[aria-current="true"] { width: 24px; background: #fbbf24; }
.promos { display: grid; gap: 14px; }
.promo { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 20px; padding: 18px; color: #fff; text-align: left; border: 0; width: 100%; min-height: 130px; }
.promo.p1 { background: linear-gradient(120deg, #b93b0a, #d97706); }
.promo.p2 { background: linear-gradient(120deg, #064e3b, #0f766e); }
.promo .t { display: inline-block; background: rgba(255, 255, 255, .22); font-size: 10.5px; font-weight: 800; padding: 2px 10px; border-radius: 999px; text-transform: uppercase; }
.promo h3 { font-size: 17px; font-weight: 800; margin-top: 6px; line-height: 1.25; }
.promo p { font-size: 12.5px; margin-top: 3px; color: rgba(255, 255, 255, .92); }
.promo .ic { width: 52px; height: 52px; border-radius: 16px; background: rgba(255, 255, 255, .18); display: grid; place-items: center; font-size: 26px; flex-shrink: 0; }

/* Kartu seksi */
.wrap.sec { width: calc(100% - 32px); max-width: 1200px; margin: 0 auto; padding: 18px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; margin-bottom: 12px; }
.sec-h h2 { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--forest); }
.sec-h span { font-size: 12px; color: var(--muted); }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; text-align: center; }

/* Flash sale */

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .flash-t b.ttl { color: #2b1200; } }
.cd { display: flex; align-items: center; gap: 4px; font-weight: 800; font-size: 13px; }

.art { position: relative; aspect-ratio: 4 / 3; border-radius: 12px; background: linear-gradient(135deg, var(--leaf-soft), var(--amber-soft)); display: grid; place-items: center; font-size: 52px; overflow: hidden; }

.art .b3 { position: absolute; left: 8px; top: 8px; background: #052e16; color: #fcd34d; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 8px; font-family: var(--font-body); max-width: 70%; line-height: 1.35; }
.art .b4 { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(255, 255, 255, .92); color: #052e16; font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 8px; font-family: var(--font-body); }
.fcard h3 { font-size: 13px; font-weight: 800; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pr { font-size: 16px; font-weight: 800; color: var(--sunset); }
.pr s { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.stockbar { position: relative; height: 16px; border-radius: 8px; background: var(--sunset-soft); overflow: hidden; }
.stockbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ea580c, #f59e0b); }
.stockbar span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 9.5px; font-weight: 800; text-transform: uppercase; color: #1a1005; }

/* Katalog */
.sortbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.sorts { flex-wrap: wrap; display: flex; gap: 8px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.sorts > span { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; flex-shrink: 0; }
.sort { padding: 7px 14px; border-radius: 11px; border: 0; background: var(--surface-2); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.sort[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.count { font-size: 12.5px; font-weight: 800; color: var(--forest); background: var(--leaf-soft); border-radius: 10px; padding: 5px 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(224px, 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 12px; min-width: 0; }
.card:hover { border-color: var(--leaf); box-shadow: 0 6px 20px rgba(0, 0, 0, .07); }
.card .open { background: none; border: 0; padding: 0; text-align: left; display: block; width: 100%; }
.card .cat-l { display: block; margin-top: 10px; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--leaf); }
.card h3 { font-size: 14px; font-weight: 800; line-height: 1.35; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.card-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }
.card-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }

.empty { grid-column: 1 / -1; padding: 36px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-shrink: 0; }
.stepper button { width: 32px; height: 32px; border: 0; background: var(--surface-2); font-weight: 800; font-size: 16px; }

/* Keunggulan, cara terima, lokasi */

.map { width: 100%; height: 300px; border: 0; border-radius: 14px; background: var(--surface-2); }

footer { background: #052e16; color: #d1fae5; padding-block: 30px 22px; font-size: 13px; }

.foot .fb img { width: 44px; height: 44px; border-radius: 12px; }
.social { display: flex; flex-wrap: wrap; gap: 8px; }
.social a { padding: 6px 12px; border: 1px solid rgba(255, 255, 255, .25); border-radius: 999px; text-decoration: none; font-weight: 700; }
.admin-link { font-size: 12px; opacity: .75; }
.demo-bar { background: var(--amber-soft); color: var(--amber-fg); font-size: 13px; font-weight: 600; padding: 8px 16px; text-align: center; }

/* Overlay: laci keranjang dan modal */

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(470px, 100%); background: var(--surface); z-index: 80; display: flex; flex-direction: column; transform: translateX(100%); visibility: hidden; transition: transform .25s, visibility .25s; padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: -8px 0 32px rgba(0, 0, 0, .2); }

.d-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; background: linear-gradient(90deg, var(--hd-a), var(--hd-b)); color: #fff; }

.box-hot { background: var(--sunset-soft); border: 1px solid color-mix(in srgb, var(--sunset) 40%, transparent); border-radius: 16px; padding: 12px; margin-top: 12px; }
.box-hot .hh { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 11.5px; font-weight: 800; color: var(--sunset); }

.tebus { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); margin-top: 6px; font-size: 12.5px; cursor: pointer; }

.box { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; min-width: 0; }

.d-foot { padding: 12px 18px 16px; border-top: 1px solid var(--line); background: var(--surface); }

.mwrap { position: fixed; inset: 0; z-index: 90; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }

.vcard { border: 2px dashed var(--leaf); background: var(--leaf-soft); border-radius: 16px; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }

.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; margin: 12px 0; text-align: center; font-size: 11.5px; }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .steps div.on { color: #07210f; } }
.ord-card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; background: var(--bg); font-size: 13px; }

.bnav { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 55; background: var(--surface); border-top: 1px solid var(--line); grid-template-columns: repeat(5, 1fr); padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px)); text-align: center; box-shadow: 0 -4px 16px rgba(0, 0, 0, .08); }

/* Admin */
.adm { padding-block: 20px 60px; }

details.ord { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; }

.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

.set-sec { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }

    case 'acCopy': { var t = $(el.getAttribute('data-id')); if (!t) return true; t.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(function () { toast('Teks disalin'); }, function () { toast(ok ? 'Teks disalin' : 'Salin manual dari kotak teks', !ok); }); else toast(ok ? 'Teks disalin' : 'Salin manual dari kotak teks', !ok); return true; }
  }
  return false;
}

/* ===== Mulai aplikasi ===== */
function route() {
  var admin = location.hash === '#admin';
  document.body.classList.toggle('in-admin', admin);
  $('view-store').hidden = admin; $('view-admin').hidden = !admin;
  closeModal(); document.body.classList.remove('cart-open');
  if (admin) { if (AD.token && !AD.data) loadAdmin(); else renderAdmin(); window.scrollTo(0, 0); }
  else if (!St.loaded) { St.loaded = true; loadStore(); }
}
(function () {
  var bar = $('demo-bar');
  if (API.demo) { bar.hidden = false; bar.textContent = 'Mode demo: pesanan dan pengaturan hanya tersimpan di browser ini. Panel admin: tambahkan #admin di alamat, PIN 1234.'; }
  bindStore(); bindAdmin();
  window.addEventListener('hashchange', route);
  route();
})();

})();
</script>
